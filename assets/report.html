<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Визуальная проверка</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#242b32;background:#f4f3ef;font-synthesis:none;--line:#d9dcd9;--muted:#616972;--blue:#2457b5}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:inherit;padding:9px 13px;border-radius:5px}button:hover{background:#f0f3f8}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #548cf0;outline-offset:3px}button[aria-pressed="true"]{color:var(--blue);background:#eaf0fc;border-color:#90abe0}a{color:var(--blue);overflow-wrap:anywhere}header{padding:26px 30px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 7px}h1{font-size:26px;letter-spacing:-.035em;margin:0 0 7px;font-weight:650}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0}.meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.primary{background:var(--blue);border-color:var(--blue);color:white;white-space:nowrap}.primary:hover{background:#194797}.toolbar{padding:14px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.toolbar button{font-size:12px}.separator{height:24px;width:1px;background:var(--line);margin:0 8px}.opacity{font-size:12px;display:flex;align-items:center;gap:7px}.opacity input{width:90px}.statistics{padding:11px 30px;display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:#fff}.statistics strong{font-weight:650;color:#242b32}.diagnostic{font-size:11px;color:var(--muted);padding:0 30px 10px;background:#fff}.workbench{display:grid;grid-template-columns:minmax(0,1fr) 330px;border-top:1px solid var(--line)}.workspace{height:68vh;min-height:360px;overflow:auto;padding:20px;background:#e7e9e8;position:relative;overscroll-behavior:contain}.boards{display:flex;align-items:flex-start;gap:18px;width:max-content;min-width:100%}.board{margin:0;flex:none}.board figcaption{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:#424d55;min-height:28px;position:sticky;top:-20px;z-index:4;background:#e7e9e8;padding:6px 0}.frame{position:relative;background:repeating-conic-gradient(#fff 0% 25%,#f1f1f1 0% 50%) 50%/16px 16px;box-shadow:0 1px 5px #2632431a;overflow:hidden}.frame img{position:absolute;top:0;left:0;max-width:none;display:block}.region{position:absolute;border:2px solid #e0502b;background:#e0502b14;pointer-events:none;z-index:3;box-shadow:0 0 0 1px white}.region span{position:absolute;top:0;left:0;background:#b93013;color:white;font-size:10px;padding:2px 5px;max-width:100%;overflow:hidden;white-space:nowrap}.sidebar{background:#fcfcfa;border-left:1px solid var(--line);max-height:68vh;overflow:auto;min-height:360px}.sidebar-head{padding:19px 18px 14px;position:sticky;top:0;background:#fcfcfa;z-index:2;border-bottom:1px solid var(--line)}.sidebar-head p{font-size:12px;line-height:1.5;margin:8px 0 0;color:var(--muted)}.issue{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:17px 18px;background:transparent}.issue[aria-pressed="true"]{box-shadow:inset 3px 0 var(--blue);background:#edf2fc}.issue-top{display:flex;justify-content:space-between;gap:12px;font-size:11px;margin-bottom:8px}.issue-id{font-family:ui-monospace,monospace;color:var(--muted)}.severity{font-weight:650}.severity-major{color:#a6301c}.severity-minor{color:#875515}.severity-detail{color:#41626c}.issue strong{font-size:13px;display:block;margin:0 0 6px}.issue p{font-size:12px;line-height:1.6;margin:0}.empty{padding:24px 18px;font-size:13px;line-height:1.7;color:var(--muted)}.details{padding:25px 30px;border-top:1px solid var(--line);background:#fff}.detail-heading{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.details p{font-size:13px;line-height:1.65;max-width:1000px;margin:12px 0}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}.evidence figure{margin:0;min-width:0;overflow:auto;border:1px solid var(--line);background:#f5f5f2}.evidence figcaption{font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}.evidence canvas{display:block;max-width:100%;height:auto;margin:auto}.notes{padding:18px 30px;border-top:1px solid var(--line);font-size:12px;line-height:1.65}.notes ul{margin:8px 0 0;padding-left:20px}.notice{color:#815221}.status{font-size:12px;min-height:18px;margin-top:8px}.copy-fallback{padding:15px 30px;background:#fff}.copy-fallback label{display:block;font-size:13px;margin-bottom:8px}.copy-fallback textarea{width:100%;height:160px;padding:12px;border:1px solid var(--line)}[hidden]{display:none!important}footer{padding:14px 30px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:900px){header{padding:20px;align-items:flex-start}h1{font-size:22px}.toolbar,.statistics,.notes,.details{padding-left:20px;padding-right:20px}.diagnostic{padding-left:20px}.workbench{grid-template-columns:minmax(0,1fr) 270px}}@media(max-width:650px){header{flex-direction:column;gap:12px}.workbench{display:block}.workspace{height:55vh;min-height:300px;padding:12px}.sidebar{max-height:340px;min-height:0;border-left:0;border-top:1px solid var(--line)}.evidence{grid-template-columns:1fr}.toolbar{gap:10px}.separator{display:none}.statistics{gap:9px 18px}.boards{gap:12px}.board figcaption{top:-12px}.primary{white-space:normal}.opacity input{width:75px}}
</style>
</head>
<body>
<header><div><p class="eyebrow">Visual audit / Проверка вёрстки</p><h1 id="title"></h1><div class="meta"><a id="page-url" rel="noreferrer" target="_blank"></a><span id="date"></span></div></div><div><button class="primary" id="copy">Скопировать замечания агенту</button><div class="status" id="status" role="status" aria-live="polite"></div></div></header>
<div class="toolbar"><div class="group" id="widths" aria-label="Ширина страницы"></div><div class="group"><div class="group" id="modes" aria-label="Режим сравнения"><button data-mode="side" aria-pressed="true">Рядом</button><button data-mode="overlay" aria-pressed="false">Наложение</button><button data-mode="diff" aria-pressed="false">Разница</button></div><label class="opacity" id="opacity-control" hidden>Макет <input id="opacity" type="range" min="0" max="100" value="50"><output id="opacity-value">50%</output></label><span class="separator"></span><div class="group" id="zooms" aria-label="Масштаб"><button data-zoom="fit" aria-pressed="true">По ширине</button><button data-zoom="full" aria-pressed="false">100%</button></div></div></div>
<div class="statistics" id="statistics"></div><div class="diagnostic">Доля отличающихся пикселей — диагностический показатель, а не оценка соответствия макету.</div>
<main><div class="workbench"><section class="workspace" id="workspace" aria-label="Сравнение изображений" tabindex="0"><div class="boards" id="boards"></div></section><aside class="sidebar"><div class="sidebar-head"><h2 id="issue-title">Замечания</h2><p id="review-state"></p></div><div id="issues"></div></aside></div><section class="details" id="details" hidden><div class="detail-heading"><p class="eyebrow" id="detail-id"></p><h2 id="detail-title"></h2></div><p id="detail-description"></p><p id="detail-suggestion" hidden></p><div class="evidence" id="evidence"></div></section><section class="notes" id="notes" hidden><h3>Контекст проверки</h3><ul id="note-list"></ul></section><section class="copy-fallback" id="copy-fallback" hidden><label for="copy-text">Автоматическое копирование недоступно. Скопируйте выделенный текст вручную.</label><textarea id="copy-text" readonly></textarea></section></main>
<footer>Визуальное сравнение одной страницы · исходные изображения сохранены без растяжения</footer>
<script>
'use strict';
const audit = __AUDIT_DATA__;
const $ = (id) => document.getElementById(id);
const el = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; };
const safeLink = (node, value, httpsOnly = false) => { node.removeAttribute('href'); try { const url = new URL(value); if (httpsOnly ? url.protocol === 'https:' : ['http:', 'https:'].includes(url.protocol)) node.href = url.href; } catch {} };
const severity = {major:'Крупное',minor:'Заметное',detail:'Мелкое'};
let index = 0;
let mode = 'side';
let zoom = 'fit';
let selected = null;
let renderVersion = 0;
const imageCache = new Map();
const loadImage = (src) => { if (!imageCache.has(src)) imageCache.set(src, new Promise((resolve,reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('Не удалось открыть изображение отчёта')); img.src = src; })); return imageCache.get(src); };
const setPressed = (container, attribute, value) => { container.querySelectorAll('button').forEach((button) => button.setAttribute('aria-pressed', String(button.getAttribute(attribute) === value))); };
const statistic = (label, value) => { const node = el('span'); node.append(document.createTextNode(label + ' '), el('strong', '', value)); return node; };
const showRegion = (frame, region, scale) => { if (!region) return; const box = el('div','region'); Object.assign(box.style,{left:region.x*scale+'px',top:region.y*scale+'px',width:region.width*scale+'px',height:region.height*scale+'px'}); box.append(el('span','',selected.id)); frame.append(box); };
const createBoard = (label, layers, width, height, scale, region) => { const board = el('figure','board'); board.append(el('figcaption','',label)); const frame = el('div','frame'); frame.style.width = width*scale+'px'; frame.style.height = height*scale+'px'; layers.forEach(({img,opacity}) => { const copy = img.cloneNode(); copy.alt = label; copy.style.width = img.naturalWidth*scale+'px'; copy.style.height = img.naturalHeight*scale+'px'; if (opacity !== undefined) {copy.style.opacity = opacity;copy.dataset.overlay = 'true';} frame.append(copy); }); showRegion(frame,region,scale); board.append(frame); return board; };
const renderBoards = async (scrollToIssue = false) => { const version = ++renderVersion; const view = audit.views[index]; if (!view) return; try { const [design,actual,diff] = await Promise.all([loadImage(view.images.design),loadImage(view.images.actual),loadImage(view.images.diff)]); if (version !== renderVersion) return; const available = $('workspace').clientWidth - (innerWidth<=650?24:40); const gap = innerWidth<=650?12:18; const commonWidth = Math.max(design.naturalWidth,actual.naturalWidth); const scale = zoom === 'full' ? 1 : Math.max(.01,Math.min(1,mode === 'side' ? (available-gap)/(design.naturalWidth+actual.naturalWidth) : available/(mode === 'diff'?diff.naturalWidth:commonWidth))); const boards = $('boards'); boards.replaceChildren(); if (mode === 'side') { boards.append(createBoard('Figma · макет',[{img:design}],design.naturalWidth,design.naturalHeight,scale,selected?.designRegion),createBoard('Браузер · страница',[{img:actual}],actual.naturalWidth,actual.naturalHeight,scale,selected?.region)); } else if (mode === 'overlay') { boards.append(createBoard('Наложение · макет поверх страницы',[{img:actual},{img:design,opacity:Number($('opacity').value)/100}],commonWidth,Math.max(design.naturalHeight,actual.naturalHeight),scale,selected?.region)); } else boards.append(createBoard('Разница · общий холст',[{img:diff}],diff.naturalWidth,diff.naturalHeight,scale,selected?.region)); boards.dataset.viewId = view.id; boards.dataset.mode = mode; boards.dataset.issueId = selected?.id ?? ''; boards.dataset.zoom = zoom; if(scrollToIssue && selected) { const workspace = $('workspace'); workspace.scrollTop = Math.max(0, selected.region.y*scale-60); const actualOffset = mode === 'side' ? design.naturalWidth*scale+gap : 0; workspace.scrollLeft = Math.max(0,actualOffset+selected.region.x*scale-workspace.clientWidth/3); } } catch(error) { if(version === renderVersion) $('boards').replaceChildren(el('p','notice',error.message)); } };
const crop = async (label, src, region) => { const figure = el('figure'); figure.append(el('figcaption','',label)); const image = await loadImage(src); const x = Math.max(0,region.x-24), y = Math.max(0,region.y-24); const w = Math.min(image.naturalWidth-x,region.width+48), h = Math.min(image.naturalHeight-y,region.height+48); if(w<=0 || h<=0) {figure.append(el('p','empty','Область находится за пределами изображения.'));return figure;} const ratio = Math.min(1,900/w,900/h); const canvas = el('canvas'); canvas.width = Math.max(1,Math.round(w*ratio)); canvas.height = Math.max(1,Math.round(h*ratio)); canvas.setAttribute('role','img'); canvas.setAttribute('aria-label',label+' — выделенная область'); const ctx = canvas.getContext('2d'); ctx.drawImage(image,x,y,w,h,0,0,canvas.width,canvas.height); ctx.strokeStyle = '#d33a19'; ctx.lineWidth = 2; ctx.strokeRect((region.x-x)*ratio,(region.y-y)*ratio,region.width*ratio,region.height*ratio); figure.append(canvas); return figure; };
const renderDetails = async () => { const issue = selected; $('details').hidden = !issue; if(!issue) return; const view = audit.views[index]; $('detail-id').textContent = issue.id+' / '+view.width+' px'; $('detail-title').textContent = issue.where; $('detail-description').textContent = issue.description; $('detail-suggestion').hidden = !issue.suggestion; $('detail-suggestion').textContent = issue.suggestion ? 'Что проверить: '+issue.suggestion : ''; $('evidence').replaceChildren(); try { const crops = await Promise.all([crop('Figma'+(issue.designRegion?'':' · та же область координат'),view.images.design,issue.designRegion || issue.region),crop('Браузер',view.images.actual,issue.region)]); if(selected === issue) { $('evidence').replaceChildren(...crops); $('evidence').dataset.issueId = issue.id; } } catch(error) { if(selected === issue) $('evidence').append(el('p','notice',error.message)); } };
const renderIssues = () => { const view = audit.views[index]; const issues = audit.issues.filter((issue) => issue.viewId === view.id); const reviewed = audit.reviewedViews.includes(view.id); $('issue-title').textContent = 'Замечания · '+issues.length; $('review-state').textContent = reviewed ? 'Визуальная проверка выполнена · '+view.width+' px' : 'Визуальный анализ не выполнен'; $('issues').replaceChildren(); if(!issues.length) $('issues').append(el('p','empty',reviewed ? 'Замечаний не найдено при визуальной проверке.' : 'Снимки и разница доступны. Для списка замечаний нужен визуальный анализ агентом.')); issues.forEach((issue) => { const button = el('button','issue'); button.type = 'button'; button.setAttribute('aria-pressed',String(selected === issue)); const top = el('span','issue-top'); top.append(el('span','issue-id',issue.id),el('span','severity severity-'+issue.severity,severity[issue.severity])); button.append(top,el('strong','',issue.where),el('p','',issue.description)); button.addEventListener('click',() => { selected = issue;renderIssues();renderBoards(true);renderDetails(); }); $('issues').append(button); }); };
const renderView = () => { const view = audit.views[index]; if(!view) return; selected = null; $('workspace').scrollTop = 0; $('workspace').scrollLeft = 0; setPressed($('widths'),'data-index',String(index)); $('statistics').replaceChildren(statistic('Макет',view.designHeight+' px'),statistic('Страница',view.actualHeight+' px'),statistic('Δ высоты',(view.heightDelta>0?'+':'')+view.heightDelta+' px'),statistic('Окно',view.width+' × '+view.viewportHeight),statistic('Различие',Number(view.mismatchPercent).toFixed(2)+'%')); const figma = el('a','','Открыть макет ↗'); safeLink(figma,view.figmaUrl,true); figma.target = '_blank';figma.rel = 'noreferrer';if(figma.hasAttribute('href')) $('statistics').append(figma); const notes = [...(audit.notes || []),...(view.warnings || [])]; $('notes').hidden = !notes.length; $('note-list').replaceChildren(...notes.map((note) => el('li','',note))); renderIssues(); renderDetails(); renderBoards(); };
$('title').textContent = audit.title;
document.title = audit.title+' — визуальная проверка';
$('page-url').textContent = audit.url; safeLink($('page-url'),audit.url);
const date = new Date(audit.createdAt); $('date').textContent = Number.isNaN(date.getTime()) ? audit.createdAt : date.toLocaleString('ru-RU');
audit.views.forEach((view,i) => { const button = el('button','',view.width+' px'+(audit.views.filter(v => v.width === view.width).length > 1 ? ' · '+view.id : ''));button.dataset.index = String(i);button.setAttribute('aria-pressed',String(i===0));button.addEventListener('click',() => {index=i;renderView();});$('widths').append(button); });
$('modes').addEventListener('click',(event) => { const button=event.target.closest('button[data-mode]');if(!button)return;mode=button.dataset.mode;setPressed($('modes'),'data-mode',mode);$('opacity-control').hidden=mode!=='overlay';renderBoards(); });
$('zooms').addEventListener('click',(event) => { const button=event.target.closest('button[data-zoom]');if(!button)return;zoom=button.dataset.zoom;setPressed($('zooms'),'data-zoom',zoom);renderBoards(Boolean(selected)); });
$('opacity').addEventListener('input',() => { $('opacity-value').textContent=$('opacity').value+'%';document.querySelectorAll('[data-overlay]').forEach((img) => img.style.opacity=Number($('opacity').value)/100); });
$('copy').addEventListener('click',async () => { const lines = ['Визуальная проверка: '+audit.title,'Страница: '+audit.url,'Проверены визуально: '+(audit.reviewedViews.length?audit.views.filter(v => audit.reviewedViews.includes(v.id)).map(v => v.width+' px ('+v.id+')').join(', '):'анализ не выполнен'),'']; audit.views.forEach((view) => { if(!audit.reviewedViews.includes(view.id)) lines.push(view.width+' px ('+view.id+'): визуальный анализ не выполнен.'); }); audit.issues.forEach((issue) => {lines.push(issue.id+' · '+issue.viewId+' · '+issue.width+' px · '+issue.where,issue.description);if(issue.suggestion)lines.push('Что проверить: '+issue.suggestion);lines.push('');});if(!audit.issues.length) lines.push(audit.reviewedViews.length?'Для проверенных ширин замечаний не найдено.':'Замечания ещё не сформированы.'); const text=lines.join('\n');try{await navigator.clipboard.writeText(text);$('status').textContent='Замечания скопированы';$('copy-fallback').hidden=true;}catch{$('copy-fallback').hidden=false;$('copy-text').value=text;$('copy-text').focus();$('copy-text').select();$('status').textContent='Текст готов для ручного копирования';} });
let resizeTimer;new ResizeObserver(() => {clearTimeout(resizeTimer);resizeTimer=setTimeout(() => renderBoards(),100);}).observe($('workspace'));
renderView();
</script>
</body>
</html>
